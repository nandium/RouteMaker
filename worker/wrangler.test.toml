name = "routemaker-worker-tests"
main = "src/index.ts"
compatibility_date = "2026-10-19"

[assets]
directory = "./test/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "routemaker-test"
database_id = "local-test"
migrations_dir = "migrations"

[vars]
FIREBASE_API_KEY = "test-firebase-key"
