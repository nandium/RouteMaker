name = "routemaker-worker"
main = "src/index.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["enable_request_signal"]

[assets]
directory = "../app/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"
# Set database_name and database_id from `wrangler d1 create` before any
# remote migration or deploy. They are intentionally not guessed here.
