			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "if [ \"$CONFIGURATION\" = \"Release\" ]; then\n    case \"$ROUTEMAKER_API_BASE_URL\" in\n        https://*) ;;\n        *)\n            echo \"error: Release builds require ROUTEMAKER_API_BASE_URL=https://...\" >&2\n            exit 1\n            ;;\n    esac\n    endpoint=\"${ROUTEMAKER_API_BASE_URL#https://}\"\n    authority=\"${endpoint%%[/?#]*}\"\n    case \"$authority\" in\n        \"\"|:*|*[!A-Za-z0-9.:-]*)\n            echo \"error: Release API URL must use a normal hostname\" >&2\n            exit 1\n            ;;\n    esac\n    host=\"$authority\"\n    port=\"\"\n    case \"$authority\" in\n        *:*)\n            host=\"${authority%%:*}\"\n            port=\"${authority#*:}\"\n            case \"$port\" in\n                \"\"|*[!0-9]*)\n                    echo \"error: Release API URL port must be numeric\" >&2\n                    exit 1\n                    ;;\n            esac\n            if [ \"$port\" -lt 1 ] 2>/dev/null || [ \"$port\" -gt 65535 ] 2>/dev/null; then\n                echo \"error: Release API URL port must be between 1 and 65535\" >&2\n                exit 1\n            fi\n            ;;\n    esac\n    old_ifs=\"$IFS\"\n    IFS=.\n    for label in $host; do\n        case \"$label\" in\n            \"\"|[-]*|*[-])\n                echo \"error: Release API URL must use a normal hostname\" >&2\n                IFS=\"$old_ifs\"\n                exit 1\n                ;;\n        esac\n    done\n    IFS=\"$old_ifs\"\nfi\n";
			showEnvVarsInLog = 0;
		};
