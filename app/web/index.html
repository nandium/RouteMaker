<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteMaker</title>
    <link rel="icon" href="/app-icon.svg" />
    <script>
      // This must run before the bundle so a saved dark theme never flashes light.
      try {
        const savedTheme = localStorage.getItem('routemaker.theme');
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || (savedTheme !== 'light' && systemDark) ? 'dark' : 'light';
      } catch {
        // The CSS light default remains usable when storage is unavailable.
      }
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
